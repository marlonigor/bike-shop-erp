{% extends 'base.html' %}

{% block title %}Produtos - Bike Shop ERP{% endblock %}
{% block page_title %}Produtos{% endblock %}

{% block header_actions %}
<a href="{% url 'catalog:product_create' %}" class="btn btn-primary">+ Novo Produto</a>
{% endblock %}

{% block content %}
<div class="card">
    <!-- Filtros -->
    <form id="product-filters" class="filters-bar" method="get" action="{% url 'catalog:product_list' %}"
        hx-get="{% url 'catalog:product_list' %}" hx-target="#product-table"
        hx-trigger="input changed delay:300ms, change" hx-indicator="#catalog-search-indicator">
        <div class="filter-item search-box">
            <label for="product-search">Buscar</label>
            <input id="product-search" type="search" class="form-input" name="q" value="{{ search }}"
                placeholder="Nome ou SKU">
        </div>

        <div class="filter-item">
            <label for="product-category">Categoria</label>
            <select id="product-category" class="form-input" name="category">
                <option value="">Todas as categorias</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if cat.is_selected %}selected{% endif %}>
                    {{ cat.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="filter-item">
            <label for="product-min-price">Preço mínimo</label>
            <input id="product-min-price" type="number" name="min_price" value="{{ min_price|default_if_none:'' }}"
                min="0" step="0.01" inputmode="decimal">
        </div>

        <div class="filter-item">
            <label for="product-max-price">Preço máximo</label>
            <input id="product-max-price" type="number" name="max_price" value="{{ max_price|default_if_none:'' }}"
                min="0" step="0.01" inputmode="decimal">
        </div>

        <div class="filter-item">
            <label for="product-availability">Disponibilidade</label>
            <select id="product-availability" name="availability">
                <option value="">Todos os itens</option>
                <option value="IN_STOCK" {% if availability == 'IN_STOCK' %}selected{% endif %}>Disponíveis</option>
                <option value="OUT_OF_STOCK" {% if availability == 'OUT_OF_STOCK' %}selected{% endif %}>Sem estoque</option>
            </select>
        </div>

        <div class="filter-actions">
            <a href="{% url 'catalog:product_list' %}" class="btn btn-sm btn-secondary">Limpar filtros</a>
            <div id="catalog-search-indicator" class="htmx-indicator" role="status" aria-label="Atualizando produtos">
                <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </div>
        </div>
    </form>

    <!-- Tabela de Produtos -->
    <div id="product-table" hx-get="{% url 'catalog:product_list' %}" hx-trigger="productListChanged from:body" aria-live="polite">
        {% include 'catalog/partials/product_table.html' %}
    </div>
</div>
{% endblock %}
