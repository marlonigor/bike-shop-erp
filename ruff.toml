target-version = "py312"
line-length = 100

exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "**/migrations/*",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[lint.per-file-ignores]
"**/apps.py" = ["F401"]
"**/__init__.py" = ["F401"]

[format]
quote-style = "single"
indent-style = "space"
