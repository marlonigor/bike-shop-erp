<div class="sale-success">
    <div class="confetti-container">
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
    </div>

    <div class="success-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h2>Venda Realizada com Sucesso!</h2>

    <div class="success-details">
        <div class="success-detail-row">
            <span class="detail-label">Codigo da Venda</span>
            <code>{{ sale.id }}</code>
        </div>
        <div class="success-detail-row">
            <span class="detail-label">Cliente</span>
            <span>{{ sale.client.name }}</span>
        </div>
        <div class="success-detail-row">
            <span class="detail-label">Itens</span>
            <span>{{ sale.items.count }} produto(s)</span>
        </div>
        <div class="success-detail-row total-row">
            <span class="detail-label">Total</span>
            <span class="detail-total">R$ {{ sale.total_amount|floatformat:2 }}</span>
        </div>
    </div>

    <div class="success-actions">
        <button class="btn btn-secondary" onclick="window.print()">
            Imprimir
        </button>
        <button class="btn btn-primary btn-lg" onclick="window.location.reload()">
            Nova Venda
        </button>
    </div>
</div>

<script>
    document.getElementById('cart-total').textContent = 'R$ 0.00';
    document.getElementById('cart-total-header').textContent = 'R$ 0.00';
</script>
