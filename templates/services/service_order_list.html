{% extends "base.html" %}

{% block title %}Oficina Mecânica - Bike Shop ERP{% endblock %}
{% block page_title %}Ordens de Serviço{% endblock %}

{% block header_actions %}
<a href="{% url 'services:service_order_create' %}" class="btn btn-primary">+ Nova OS</a>
{% endblock %}

{% block content %}
<div class="card" x-data="{ currentStatus: '{{ selected_status|default:'ALL' }}' }">
    <!-- Barra de Filtros e Busca -->
    <div style="display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap;">
        <!-- Abas de Status -->
        <div class="status-tabs" style="display: flex; gap: var(--space-xs); background: var(--color-bg-secondary); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--color-glass-border);">
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'ALL' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'ALL'"
                hx-get="{% url 'services:service_order_list' %}?status=ALL"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Todas
            </button>
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'DRAFT' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'DRAFT'"
                hx-get="{% url 'services:service_order_list' %}?status=DRAFT"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Orçamentos
            </button>
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'APPROVED' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'APPROVED'"
                hx-get="{% url 'services:service_order_list' %}?status=APPROVED"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Aprovadas
            </button>
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'IN_PROGRESS' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'IN_PROGRESS'"
                hx-get="{% url 'services:service_order_list' %}?status=IN_PROGRESS"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Em Manutenção
            </button>
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'COMPLETED' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'COMPLETED'"
                hx-get="{% url 'services:service_order_list' %}?status=COMPLETED"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Concluídas
            </button>
            <button type="button" class="btn btn-sm"
                :class="currentStatus === 'DELIVERED' ? 'btn-primary' : 'btn-secondary'"
                @click="currentStatus = 'DELIVERED'"
                hx-get="{% url 'services:service_order_list' %}?status=DELIVERED"
                hx-target="#orders-table"
                hx-include="[name='q']">
                Entregues
            </button>
        </div>

        <!-- Campo de Busca -->
        <div style="position: relative; max-width: 320px; width: 100%;">
            <input type="text" name="q" placeholder="Buscar por cliente, bike, quadro..."
                value="{{ search }}"
                hx-get="{% url 'services:service_order_list' %}"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#orders-table"
                hx-include="[name='status']"
                hx-indicator="#orders-indicator"
                class="form-control"
                style="padding-right: 36px;">
            <div id="orders-indicator" class="htmx-indicator" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </div>
        </div>
    </div>

    <!-- Tabela de OS -->
    <div id="orders-table">
        {% include "services/partials/order_table.html" %}
    </div>
</div>
{% endblock %}
