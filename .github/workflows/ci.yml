name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Types, Lint, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up environment file
        run: cp .env.example .env

      - name: Run shared quality checks
        run: bash bin/check

      - name: Scan committed history for secrets
        run: bash bin/scan-secrets
